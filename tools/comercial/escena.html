    c.fillRect(x0 + c.measureText(text.slice(0, n)).width + size * 0.12, base - size * 0.62, size * 0.5, size * 0.62);
    c.globalAlpha = 1;
  }
}

// La marca cuadrada de la máquina, en el cristal. `pop` (1 → 0) es el golpe con que se estampa.
function squareMark(c, x, y, q, alpha, pop = 0) {
  if (alpha <= 0.004) return;
  const s = q * (1 + 0.7 * pop);
  c.globalAlpha = alpha; c.strokeStyle = rgb(COLD); c.lineWidth = 2.6; c.lineJoin = "miter";
  c.shadowColor = "rgba(1,8,15,0.6)"; c.shadowBlur = 7; c.shadowOffsetX = 0; c.shadowOffsetY = 2;
  c.strokeRect(x - s / 2, y - s / 2, s, s);
  c.shadowColor = "transparent";
  c.fillStyle = rgb([236, 252, 255]);
  c.fillRect(x - s * 0.24, y - s * 0.24, s * 0.48, s * 0.48);
  if (pop > 0.03) {
    c.globalCompositeOperation = "lighter";
    c.fillStyle = `rgba(190,240,250,${(0.5 * pop * alpha).toFixed(3)})`;
    c.fillRect(x - s, y - s, s * 2, s * 2);
    c.globalCompositeOperation = "source-over";
  }
  c.globalAlpha = 1;
}

function buildTally() {
  const M = T.measure, P = D.pack, C = D.cell, rnd = mulberry32(SEED + 505);
  const hero = grains[0], boxed = grains[1];
  // El otro anuncio de 683: el vecino más cercano de la caja (son dos versiones de la misma lista).
  const gap = (g) => Math.hypot(g.tx - boxed.tx, g.ty - boxed.ty);
  const mate = grains.filter((g) => g.cls === "doubt" && g !== boxed).reduce((a, b) => (gap(a) <= gap(b) ? a : b));
  hero.lifts.push([M.open[0], Infinity]);
  for (const g of [boxed, mate]) g.lifts.push([M.pair_in[0], Infinity]);
  for (const r of review.rings) if (r.g === boxed || r.g === mate) r.gone = M.pair_in[0];
  const ringOf = (g) => review.rings.find((r) => r.g === g);

  // El anuncio, en dos renglones, y dónde está cada palabra que la máquina saca de él.
  const font = `500 ${PACK.size}px Roboto, "Noto Color Emoji"`;
  measure.font = font;
  const cut = P.text.indexOf(" ("), rows = cut > 0 ? [P.text.slice(0, cut), P.text.slice(cut + 1)] : [P.text];
  const wide = Math.max(...rows.map((r) => measure.measureText(r).width));
  const bases = rows.map((_, i) => (i - (rows.length - 1) / 2) * PACK.lead + PACK.size * 0.36);
  const width = (text, f) => { measure.font = f; return measure.measureText(text).width; };
  const find = (word) => {
    const row = rows.findIndex((r) => r.includes(word)), at = rows[row].indexOf(word);
    const x0 = width(rows[row].slice(0, at), font) - wide / 2;
    return { text: word, row, at, x0, x1: x0 + width(word, font), base: bases[row] };
  };

  // La cabecera de la celda y la cuenta, ya medidas, para que cada pieza llegue a su sitio exacto.
  const nameFont = "400 64px Alice", figFont = `700 ${HEAD.size}px Roboto`, unitFont = "500 40px Roboto";
  const sumFont = `500 ${SUM.size}px Roboto`, bigFont = `700 ${SUM.bigSize}px Roboto`;
  const name = `${C.product} · ${C.province}`, nameX = W / 2 - width(name, nameFont) / 2;
  const wLow = width(String(C.low), figFont), wDash = width("–", figFont), wHigh = width(String(C.high), figFont);
  const wUnit = width(C.unit, unitFont), figGap = 14, figX = W / 2 - (wLow + wDash + wHigh + figGap + wUnit) / 2;
  const price = `${fmtInt(P.price)} CUP`, pounds = `${P.pounds} lb`, sumA = `${price} ÷ ${pounds}`;
  const digit = width("0", bigFont), bigUnit = SUM.bigSize * 0.465;
  const bigW = 3 * digit + SUM.bigSize * 0.16 + width(C.unit, `500 ${bigUnit}px Roboto`);
  const medFont = "400 36px Roboto", tickFont = "500 40px Roboto", wMed = width(`${M.median_word} `, medFont), wTick = width(String(C.median), tickFont);
  tally = {
    hero, pair: [boxed, mate], rings: [ringOf(boxed), ringOf(mate)],
    rows, bases, wide, font, L: wide + 96, words: [find(P.product), find(P.quantity), find(P.amount)],
    // lo que queda en cada etiqueta: el dato ya normalizado
    values: [P.product, pounds, price, P.province], raws: [P.product, P.quantity, P.amount, P.province],
    tags: M.tag_names,
    name, nameFont, nameX, nameProv: nameX + width(`${C.product} · `, nameFont),
    figFont, unitFont, figLow: figX, figDash: figX + wLow, figHigh: figX + wLow + wDash,
    figAlone: W / 2 - (wHigh + figGap + wUnit) / 2,
    sumFont, sumA, sumB: `${fmtInt(D.box.price)} CUP ÷ ${D.box.pounds} lb`, sumQty: SUM.x + width(`${price} ÷ `, sumFont),
    bigX: W / 2 - bigW / 2,
    x: [rulerX(C.values[0]), rulerX(C.values[1]), rulerX(C.values[2])],
    medFont, tickFont, wMed, wTick,
    icon: makeRing(29, 17, rnd),                           // el aro que firma «2 a mano»
    spots: [[SUM.icon, SUM.base + 14], [SUM.icon, SUM.base - 44]],   // dónde esperan los dos granos de la caja (el que cae primero, abajo)
  };

  // La persona vuelve un momento, a firmar su parte de la cuenta.
  const [h0, h1] = M.hand, at = [LAST.icon, LAST.bases[1] - 17];
  const onIcon = (u) => { const q = strokePoint(tally.icon, u); return ptGlass(at[0] + q.x, at[1] + q.y); };
  const away = ptGlass(-70, at[1] - 50);                  // se va por donde vino, sin cruzar lo escrito
  yemaVisits.push({
    fade: [M.yema[0], M.yema[0] + 0.14, M.yema[1] - 0.3, M.yema[1]],
    segs: [
      segMove(M.yema[0], h0, ptGlass(-60, at[1] + 150), onIcon(0), { h0: 1.4, bow: 0.2, ease: easeOutCubic }),
      segTrace(h0, h1, onIcon, 0.05),
      segMove(h1, M.yema[1], onIcon(1), away, { h1: 1.2, bow: 0.3, ease: easeInCubic }),
    ],
  });
}

// El anuncio de 10 lb en un instante: sale de la fila, se abre en el cristal y, ya leído, se cierra en su grano.
function packPose(cam, t) {
  const M = T.measure, g = tally.hero;
  const up = clamp01((t - M.open[0]) / (M.open[1] - M.open[0]));
  const down = clamp01((t - M.pack_out[0]) / (M.pack_out[1] - M.pack_out[0]));
  const kp = easeInOutCubic(up), ks = easeOutBack(up, 0.9), kd = easeInOutCubic(down), hop = Math.sin(Math.PI * kp);
  const pr = project(cam, wx(g.tx), wy(g.ty), 0), gp = glassPoint(PACK.x, PACK.y, t), spot = glassPoint(SUM.icon, SUM.base - 14, t);
  const lt = g.L * cam.z, wt = g.Wd * cam.z;
  const open = lt * Math.pow(tally.L / lt, ks), tall = wt * Math.pow(PACK.wide / wt, ks);
  const len = open * Math.pow(g.L * TOKEN / open, kd);
  return {
    x: lerp(lerp(pr.x, gp[0], kp), spot[0], kd) - 46 * Math.sin(Math.PI * kd),
    y: lerp(lerp(pr.y, gp[1], kp) - 30 * hop, spot[1], kd),
    a: lerp(lerp(cam.roll, PACK.a + glassAt(t).r, kp) + 0.05 * hop, glassAt(t).r, kd),
    len, wid: tall * Math.pow(g.Wd * TOKEN / tall, kd), s: len / tally.L, ks, kp, kd,
    n: lerp(lerp(lerp(2.8, 3.7, smooth(60, 240, lt)), 5, smooth(0.1, 0.6, ks)), 2.9, kd),
  };
}

function drawPack(c, cam, t) {
  const M = T.measure;
  if (t < M.open[0] || t >= M.pack_out[1]) return;
  const P = packPose(cam, t);
  const cold = Math.max(1 - smooth(0.04, 0.5, P.ks), smooth(0.3, 1, P.kd));       // claro en la fila, crema al abrirse
  glowAt(c, P.x, P.y, P.a, P.len, P.wid, COLD_GLOW, 0.5);
  drawPill(c, P.x, P.y, P.a, P.len, P.wid, P.n, { clear: cold }, smooth(0.05, 0.7, P.kp));
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.translate(P.x, P.y); c.rotate(P.a);
  squareMark(c, -P.len / 2 - 24, 0, 24, P.kd);                                   // al cerrarse recupera su marca
  const ink = smooth(0.62, 0.96, P.ks) * (1 - smooth(0, 0.4, P.kd));
  if (ink > 0.01) {
    c.scale(P.s, P.s);
    c.font = tally.font; c.textAlign = "left"; c.textBaseline = "alphabetic";
    tally.rows.forEach((row, r) => {
      // el renglón por tramos: las palabras que ya despegaron dejan su hueco
      const gone = tally.words.map((w, i) => ({ w, i })).filter(({ w, i }) => w.row === r && t >= M.words[i][0]);
      let from = 0;
      const piece = (a, b) => {
        if (b <= a) return;
        c.font = tally.font;
        c.fillText(row.slice(a, b), c.measureText(row.slice(0, a)).width - tally.wide / 2, tally.bases[r]);
      };
      c.fillStyle = INK; c.globalAlpha = ink;
      for (const { w } of gone.sort((p, q) => p.w.at - q.w.at)) { piece(from, w.at); from = w.at + w.text.length; }
      piece(from, row.length);
    });
    // la máquina subraya lo que va a sacar: recto, fino y con remate cuadrado
    c.fillStyle = MACHINE_ON_LIGHT;
    tally.words.forEach((w, i) => {
      const u = easeOutCubic((t - M.marks[i]) / 0.16);
      if (u <= 0) return;
      const x = lerp(w.x0, w.x1, u), y = w.base + 9;
      c.globalAlpha = ink;
      c.fillRect(w.x0, y - 1.4, x - w.x0, 2.8);
      c.fillRect(x - 3, y - 3, 6, 6);
    });
  }
  c.restore();
}

// Una palabra en vuelo: va en arco de un punto a otro, cambia de tamaño y de la tinta al blanco.
function flyText(c, text, from, to, e, sizes, bow, light) {
  const dx = to[0] - from[0], dy = to[1] - from[1], arc = bow * Math.sin(Math.PI * e);
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.translate(from[0] + dx * e - dy * arc, from[1] + dy * e + dx * arc);
  c.rotate(-0.6 * bow * Math.sin(Math.PI * e));
  glassText(c, text, 0, 0, `500 ${lerp(sizes[0], sizes[1], e).toFixed(2)}px Roboto`, rgb(mix3(INK_RGB, [255, 255, 255], light)), 1);
  c.restore();
}

function drawFlights(c, cam, t) {
  const M = T.measure;
  tally.words.forEach((w, i) => {
    const [t0, t1] = M.words[i];
    if (t < t0 || t >= t1) return;
    const e = easeInOutCubic((t - t0) / (t1 - t0)), P = packPose(cam, t), v = rot([w.x0 * P.s, w.base * P.s], P.a);
    flyText(c, w.text, [P.x + v[0], P.y + v[1]], glassPoint(SLOT.val, SLOT.bases[i], t), e, [PACK.size * P.s, SLOT.size],
      i % 2 ? 0.2 : -0.22, smooth(0.04, 0.4, e));
  });
  // «La Habana» no está en el texto: la pone el grupo de origen, y por eso entra desde fuera del cuadro.
  const [p0, p1] = M.province;
  if (t >= p0 && t < p1) {
    const e = easeOutCubic((t - p0) / (p1 - p0));
    flyText(c, tally.values[3], glassPoint(W + 70, SLOT.bases[3] - 150, t), glassPoint(SLOT.val, SLOT.bases[3], t), e, [SLOT.size, SLOT.size], 0.3, 1);
  }
}

// Las cuatro etiquetas (las teclea la máquina) y el dato que cae en cada una.
function drawFields(c, t) {
  const M = T.measure, lands = [M.words[0][1], M.words[1][1], M.words[2][1], M.province[1]];
  const [g0, g1] = M.regroup, out = smooth(g0, g0 + 0.16, t);
  if (t >= M.tags[0] && out < 1) {
    tally.tags.forEach((tag, i) => {
      const y = SLOT.bases[i], q = t - lands[i];
      typedText(c, tag, SLOT.tag - 22 * out, y - 3, 34, 400, rgb(COLD), M.tags[i], t, "right", 1 - out);
      const u = easeOutCubic((t - M.tags[i] - 0.06) / 0.3) * (1 - out);        // la línea donde cae el dato
      if (u > 0) {
        const x = lerp(SLOT.val, SLOT.val + 264, u);
        c.globalAlpha = 0.85 * (1 - out); c.fillStyle = rgb(COLD);
        c.fillRect(SLOT.val, y + 13, x - SLOT.val, 2.2);
        c.fillRect(x - 3.5, y + 10.6, 7, 7);
        if (q > 0 && q < 0.4) {                                              // al caer el dato, la línea lo acusa
          c.globalCompositeOperation = "lighter"; c.globalAlpha = 0.6 * Math.exp(-q * 11);
          c.fillRect(SLOT.val, y + 11, 264, 6);
          c.globalCompositeOperation = "source-over";
        }
        c.globalAlpha = 1;
      }
    });
  }
  const font = `500 ${SLOT.size}px Roboto`, move = easeInOutCubic(clamp01((t - g0) / (g1 - g0)));
  // a dónde va cada dato cuando se arma la cuenta: producto y provincia, a la cabecera; precio y cantidad, a la división
  const goal = [[tally.nameX, HEAD.name], [tally.sumQty, SUM.base], [SUM.x, SUM.base], [tally.nameProv, HEAD.name]];
  tally.values.forEach((value, i) => {
    const q = t - lands[i];
    if (q < 0 || t >= g1) return;
    const settle = -7 * Math.exp(-q * 10) * Math.cos(q * 30);                // cae y se asienta
    const x = lerp(SLOT.val, goal[i][0], move) - 60 * Math.sin(Math.PI * move) * (i % 2 ? 1 : -1) * 0.5;
    const y = lerp(SLOT.bases[i], goal[i][1], move) + settle;
    const head = i === 0 || i === 3;
    if (head && move > 0) {                                                  // en vuelo pasa de dato a titular
      const size = lerp(SLOT.size, 64, move);
      glassText(c, value, x, y, `500 ${size.toFixed(2)}px Roboto`, "#ffffff", 1 - smooth(0.3, 0.7, move));
      glassText(c, value, x, y, `400 ${size.toFixed(2)}px Alice`, "#ffffff", smooth(0.3, 0.7, move));
      return;
    }
    // el texto llega como venía («10lb», «7500cup») y al caer queda a la misma medida («10 lb», «7.500 CUP»)
    const flip = clamp01(q / 0.16), raw = tally.raws[i];
    c.save();
    c.translate(x, y - SLOT.size * 0.34); c.scale(1, raw === value ? 1 : Math.abs(Math.cos(Math.PI * flip)) * 0.9 + 0.1); c.translate(-x, -(y - SLOT.size * 0.34));
    glassText(c, flip < 0.5 ? raw : value, x, y, font, "#ffffff", 1);
    c.restore();
  });
}

// La cabecera de la celda: «Pollo · La Habana» y, cuando ya están las dos cuentas, «683–750 CUP/lb».
function drawHead(c, t) {
  const M = T.measure;
  if (t >= M.regroup[1]) glassText(c, tally.name, tally.nameX, HEAD.name, tally.nameFont, "#ffffff", 1);
  glassText(c, "–", tally.figDash, HEAD.figure, tally.figFont, "#ffffff", smooth(M.rise_b[1] - 0.12, M.rise_b[1] + 0.04, t));
}

// Un contador de tambores: cada cifra rueda hacia arriba y, al pasar del 9 al 0, arrastra a la de su izquierda.
// Se pinta aparte, a tamaño fijo, para que los tambores asomen por una ventana de bordes blandos.
const DRUM = { w: 264, h: 176, size: 120, x: 30, base: 132 };
const drumCanvas = mk(DRUM.w, DRUM.h), dc = drumCanvas.getContext("2d");
function drawCounter(c, x, base, size, value, alpha, speed) {
  dc.setTransform(1, 0, 0, 1, 0, 0);
  dc.globalCompositeOperation = "source-over"; dc.clearRect(0, 0, DRUM.w, DRUM.h);
  dc.font = `700 ${DRUM.size}px Roboto`; dc.textAlign = "center"; dc.textBaseline = "alphabetic"; dc.fillStyle = "#ffffff";
  const wd = dc.measureText("0").width, tall = DRUM.size * 0.94;
  for (let k = 0; k < 3; k++) {                                              // k = 0: las unidades
    const unit = Math.pow(10, k), turn = k === 0 ? value % 1 : Math.max(0, (value % unit) - (unit - 1));
    const d = Math.floor(value / unit) % 10, col = DRUM.x + (2.5 - k) * wd;
    const lit = k === 0 ? 1 : 0.2 + 0.8 * smooth(unit * 0.8, unit, value);   // los ceros de la izquierda, apagados
    dc.globalAlpha = lit * lerp(1, 0.5, smooth(5, 26, speed / unit));        // lo que gira deprisa pesa menos
    dc.fillText(String(d), col, DRUM.base - turn * tall);
    if (turn > 0.001) dc.fillText(String((d + 1) % 10), col, DRUM.base + (1 - turn) * tall);
  }
  const top = DRUM.base - DRUM.size * 0.86, mask = dc.createLinearGradient(0, top, 0, top + DRUM.size * 1.02);
  mask.addColorStop(0, "rgba(0,0,0,0)"); mask.addColorStop(0.16, "rgba(0,0,0,1)");
  mask.addColorStop(0.84, "rgba(0,0,0,1)"); mask.addColorStop(1, "rgba(0,0,0,0)");
  dc.globalCompositeOperation = "destination-in"; dc.globalAlpha = 1;
  dc.fillStyle = mask; dc.fillRect(0, 0, DRUM.w, DRUM.h);
  const k = size / DRUM.size;
  c.globalAlpha = alpha;
  c.shadowColor = `rgba(1,8,15,${(0.72 * alpha).toFixed(3)})`; c.shadowBlur = 9; c.shadowOffsetX = 0; c.shadowOffsetY = 3;
  c.drawImage(drumCanvas, x - DRUM.x * k, base - DRUM.base * k, DRUM.w * k, DRUM.h * k);
  c.shadowColor = "transparent"; c.globalAlpha = 1;
  return wd * 3 * k;
}

// Las dos cuentas: 7.500 ÷ 10 lb → 750 y, más breve, 27.300 ÷ 40 lb → 683. Cada resultado sube a la cabecera.
function drawSums(c, t) {
  const M = T.measure, C = D.cell;
  if (t < M.regroup[1] - 0.12) return;
  // los renglones de la división
  const outA = smooth(M.pair_in[0], M.pair_in[0] + 0.18, t);
  if (t >= M.regroup[1]) glassText(c, tally.sumA, SUM.x - 18 * outA, SUM.base, tally.sumFont, "#ffffff", 1 - outA);
  else glassText(c, "÷", tally.sumQty - measureWidth(c, "÷ ", tally.sumFont), SUM.base, tally.sumFont, "#ffffff", smooth(M.regroup[1] - 0.1, M.regroup[1], t));
  const inB = smooth(M.roll_b[0] - 0.12, M.roll_b[0] + 0.02, t), outB = smooth(M.rise_b[0] - 0.08, M.rise_b[0] + 0.12, t);
  glassText(c, tally.sumB, SUM.x + 16 * (1 - inB), SUM.base, tally.sumFont, "#ffffff", inB * (1 - outB));

  const figure = (target, roll, rise, restX, k) => {
    const start = roll[0] - 0.06;
    if (t < start) return;
    const up = easeInOutCubic(clamp01((t - rise[0]) / (rise[1] - rise[0])));
    const size = lerp(SUM.bigSize, HEAD.size, up), q = t - roll[1];
    const pop = q > 0 ? 1 + 0.08 * Math.exp(-q * 13) * Math.cos(q * 24) : 1;             // al quedar fija, un golpe
    const x = lerp(tally.bigX, restX, up), base = lerp(SUM.big, HEAD.figure, up) - 36 * Math.sin(Math.PI * up) * k;
    c.save();
    c.translate(x + size * 0.84, base); c.scale(pop, pop); c.translate(-x - size * 0.84, -base);
    const left = 1 - clamp01((t - roll[0]) / (roll[1] - roll[0]));                        // lo que le falta por rodar
    const speed = target * M.roll_power * Math.pow(left, M.roll_power - 1) / (roll[1] - roll[0]);
    const wide = drawCounter(c, x, base, size, rolled(target, roll, t), smooth(start, roll[0], t), speed);
    if (q > 0 && q < 0.5) {                                                              // y se enciende un instante
      c.globalCompositeOperation = "lighter";
      glassText(c, String(target), x, base, `700 ${size.toFixed(2)}px Roboto`, rgb(COLD_GLOW), 0.7 * Math.exp(-q * 8));
      c.globalCompositeOperation = "source-over";
    }
    c.restore();
    return { x: x + wide + size * 0.16, base, size: size * 0.465, up };
  };
  // el 750 se corre para dejarle el sitio al 683 cuando llega
  const shift = easeInOutCubic(clamp01((t - M.rise_b[0]) / (M.rise_b[1] - M.rise_b[0])));
  const a = figure(C.high, M.roll_a, M.rise_a, lerp(tally.figAlone, tally.figHigh, shift), 1);
  if (a) glassText(c, C.unit, a.x, a.base, `500 ${a.size.toFixed(2)}px Roboto`, rgb(COLD), smooth(M.roll_a[0] - 0.1, M.roll_a[0], t));
  const b = figure(C.low, M.roll_b, M.rise_b, tally.figLow, -1);
  if (b) glassText(c, C.unit, b.x, b.base, `500 ${b.size.toFixed(2)}px Roboto`, rgb(COLD), smooth(M.roll_b[0] - 0.1, M.roll_b[0], t) * (1 - b.up));
}

// La recta: una regla que se dibuja sola, con una raya cada 5 CUP/lb, las dos medidas y la muesca de la mediana.
function drawRuler(c, t) {
  const M = T.measure, C = D.cell;
  if (t < M.line[0]) return;
  const u = easeInOutCubic(clamp01((t - M.line[0]) / (M.line[1] - M.line[0]))), xe = lerp(RULER.x0, RULER.x1, u);
  c.fillStyle = rgb(COLD);
  c.shadowColor = "rgba(1,8,15,0.6)"; c.shadowBlur = 7; c.shadowOffsetX = 0; c.shadowOffsetY = 2;
  c.globalAlpha = 1;
  c.fillRect(RULER.x0, RULER.y - 1.3, xe - RULER.x0, 2.6);
  c.shadowColor = "transparent";
  c.fillRect(RULER.x0 - 4, RULER.y - 4, 8, 8); c.fillRect(xe - 4, RULER.y - 4, 8, 8);     // remates cuadrados
  for (let v = Math.ceil(RULER.lo / 5) * 5 + 5; v < RULER.hi; v += 5) {
    const x = rulerX(v);
    if (x > xe) break;
    c.globalAlpha = 0.55;
    c.fillRect(x - 1, RULER.y, 2, v % 10 === 0 ? 11 : 6);
  }
  c.globalAlpha = 1;
  const shown = [];
  for (const v of [C.low, C.high]) {                                         // las dos medidas, más largas
    const x = rulerX(v);
    if (x > xe) continue;
    c.fillRect(x - 1.6, RULER.y - 4, 3.2, 21);
    shown.push(v);
  }
  // sus cifras; a la del 683 se le antepone «mediana» cuando cae la muesca
  const at = M.line[1] - 0.08, med = t - M.median, slide = easeOutCubic(med / 0.14);
  for (const v of shown) {
    const mid = rulerX(v), isMed = v === C.median, total = tally.wMed + tally.wTick;
    const x = isMed ? lerp(mid - tally.wTick / 2, mid - total / 2 + tally.wMed, slide) : mid - measureWidth(c, String(v), tally.tickFont) / 2;
    const rise = smooth(at, at + 0.2, t);
    glassText(c, String(v), x, RULER.labels + 10 * (1 - rise), tally.tickFont, "#ffffff", rise);
    if (isMed) typedText(c, M.median_word, mid - total / 2, RULER.labels, 36, 400, rgb(COLD), M.median_typed, t);
  }
  if (med > 0) {                                                             // la muesca: un triángulo bajo la recta
    const pop = Math.exp(-med * 14), x = rulerX(C.median), s = 9 * (1 + 0.8 * pop), y = RULER.y + 19;
    c.fillStyle = rgb([236, 252, 255]); c.globalAlpha = clamp01(med / 0.05);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x - s, y + s * 1.25); c.lineTo(x + s, y + s * 1.25); c.closePath(); c.fill();
    if (pop > 0.03) {
      c.globalCompositeOperation = "lighter"; c.fillStyle = `rgba(190,240,250,${(0.5 * pop).toFixed(3)})`;
      c.fillRect(x - 26, y - 12, 52, 44);
      c.globalCompositeOperation = "source-over";
    }
    c.globalAlpha = 1;
  }
}

// Dónde está cada uno de los tres granos de la celda en el cristal (0 y 1: los de la caja; 2: el de 10 lb).
function tokenAt(i, t) {
  const M = T.measure, land = M.drops[i], rest = [tally.x[i], RULER.y - 36 - (i === 1 ? 66 : 0)];
  let from, x, y, a = 0;
  if (i === 2) {                                           // espera junto a su cuenta y se aparta cuando llega la caja
    const e = easeInOutCubic(clamp01((t - M.pair_in[0]) / (M.pair_in[1] - M.pair_in[0])));
    from = SUM.park;
    x = lerp(SUM.icon, from[0], e); y = lerp(SUM.base - 14, from[1], e) - 40 * Math.sin(Math.PI * e); a = 0.1 * Math.sin(Math.PI * e);
  } else {                                                 // los dos de la caja entran por el borde, del lado de lo repasado
    const u = clamp01((t - M.pair_in[0] - 0.05 * i) / (M.pair_in[1] - M.pair_in[0])), e = easeOutBack(u, 1.1);
    from = tally.spots[i];
    x = lerp(-120, from[0], e); y = lerp(from[1] - 60, from[1], easeOutCubic(u)); a = -0.3 * (1 - easeOutCubic(u));
  }
  const fall = clamp01((t - (land - 0.34)) / 0.34), q = t - land;
  let sq = 1;
  if (fall > 0) {                                          // baja a la recta: cae con peso y rebota
    x = lerp(from[0], rest[0], easeInOutCubic(fall));
    y = lerp(from[1], rest[1], fall * fall);
    a = 0.14 * Math.sin(Math.PI * fall) * (i === 2 ? -1 : 1);
    if (q > 0) { y -= 15 * hop2(q / 0.34); sq = 1 - 0.18 * Math.exp(-q * 13) * Math.cos(q * 34); a = 0.05 * Math.exp(-q * 9) * Math.sin(q * 30); }
  }
  return { x, y, a, sq };
}

function drawTokens(c, t) {
  const M = T.measure, items = [];
  if (t >= M.pair_in[0]) tally.pair.forEach((g, i) => items.push({ g, i, ...tokenAt(i, t) }));
  if (t >= M.pack_out[1]) items.push({ g: tally.hero, i: 2, ...tokenAt(2, t) });
  for (const k of items) {
    const p = glassPoint(k.x, k.y, t), len = k.g.L * TOKEN, wid = k.g.Wd * TOKEN, ang = k.a + glassAt(t).r;
    if (k.i === 2) glowAt(c, p[0], p[1], ang, len, wid, COLD_GLOW, 0.4);
    drawPill(c, p[0], p[1], ang, len, wid * k.sq, 2.9, k.i === 2 ? { clear: 1 } : { doubt: 0.06 }, 0.8);
    if (k.i === 2) {
      c.save();
      c.setTransform(1, 0, 0, 1, 0, 0); c.translate(p[0], p[1]); c.rotate(ang);
      squareMark(c, -len / 2 - 24, 0, 24, 1);
      c.restore();
    }
  }
  return items;
}

// El cierre: «3 anuncios · 2 a mano · 1 por el sistema», dibujado con los dos trazos.
function drawLast(c, t) {
  const M = T.measure, C = D.cell, font = `500 ${LAST.size}px Roboto`;
  const soft = (text, base, t0, color) => {                // letra a letra, sin cursor: así escribe la persona
    if (t < t0) return;
    c.font = font;
    let x = LAST.x;
    for (let i = 0; i < text.length; i++) {
      const u = clamp01((t - t0 - i * 0.016) / 0.16);
      if (u > 0) glassText(c, text[i], x, base + (1 - easeOutCubic(u)) * 7, font, color, u);
      c.font = font;
      x = LAST.x + c.measureText(text.slice(0, i + 1)).width;
    }
  };
  soft(`${C.ads} anuncios`, LAST.bases[0], M.count, "#ffffff");
  soft(`${C.manual} a mano`, LAST.bases[1], M.by_hand, "rgb(255,242,214)");
  typedText(c, M.system_line, LAST.x, LAST.bases[2], LAST.size, 500, rgb([226, 244, 246]), M.by_system, t);
  const q = t - M.stamp;
  if (q > 0) squareMark(c, LAST.icon, LAST.bases[2] - 17, 30, clamp01(q / 0.05), Math.exp(-q * 14));
}

// Todo B5, en orden: lo que se abre, lo que se lee y, al final, los dos trazos.
function drawTally(c, cam, t) {
  const M = T.measure;
  if (t < M.open[0]) return;
  drawPack(c, cam, t);
  const tokens = drawTokens(c, t);
  onGlass(c, t);
  drawFields(c, t);
  drawHead(c, t);
  drawSums(c, t);
  drawRuler(c, t);
  drawLast(c, t);
  c.setTransform(1, 0, 0, 1, 0, 0);
  drawFlights(c, cam, t);
  // los trazos a mano: los aros de los dos granos de la caja y el que firma «2 a mano»
  const rings = tokens.filter((k) => k.i < 2);
  if (!rings.length && t < M.hand[0]) return;
  pencilBegin();
  for (const k of rings) {
    const r = tally.rings[k.i];
    onGlass(pc, t);
    pc.translate(k.x, k.y); pc.rotate(k.a); pc.scale(TOKEN, TOKEN * k.sq);
    drawStroke(pc, r.stroke, 0, 1, 10.5, PENCIL);
  }
  if (t >= M.hand[0]) {
    const u = pen(clamp01((t - M.hand[0]) / (M.hand[1] - M.hand[0]))), hot = 1 - smooth(M.hand[1], M.hand[1] + 0.35, t);
    onGlass(pc, t);
    pc.translate(LAST.icon, LAST.bases[1] - 17);
    drawStroke(pc, tally.icon, 0, u, 4.2, PENCIL);
    if (hot > 0.01) drawStroke(pc, tally.icon, u - 0.3, u, 2.5, rgb(mix3(GUAYABA, PENCIL_HOT, hot)));
  }
  onGlass(pc, t);
  pencilEnd(c, pc.getTransform().scaleSelf(1.1), 1, 0.3);
}

// ── El cuadro ───────────────────────────────────────────────────────────────

function drawScene(c, t) {
  const cam = camera(t);
  c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.filter = "none";
  c.shadowColor = "transparent";
  drawTable(c, cam);
  drawQuestion(c, cam, t);
  c.setTransform(1, 0, 0, 1, 0, 0);

  const all = ordered.map((g) => [g, pose(g, t)]);
  // Lo apartado va debajo; lo que se enciende, encima. Lo que anda fuera de la mesa no se pinta aquí.
  const poses = all.filter(([, p]) => !p.lifted);
  const flying = poses.filter(([, p]) => p.hz > 70).sort((a, b) => a[1].hz - b[1].hz);
  const resting = poses.filter(([, p]) => p.hz <= 70);
  for (const [g, p] of resting) if (p.dim > 0.5 && !p.top) drawGrain(c, cam, g, p);
  for (const [g, p] of resting) if (p.dim <= 0.5 && !p.top) drawGrain(c, cam, g, p);
  drawDust(c, cam, t);
  c.setTransform(1, 0, 0, 1, 0, 0);
  for (const [, p] of resting) if (p.flash > 0.03 && !p.top) drawGlow(c, cam, p, [170, 232, 245], 0.3 * p.flash);

  drawImpact(c, cam, t);
  c.setTransform(1, 0, 0, 1, 0, 0);
  const guaniLanded = t >= T.guani;
  if (guaniLanded) drawGuani(c, cam, t);
  drawRays(c, cam, t);
  c.setTransform(1, 0, 0, 1, 0, 0);

  for (const [g, p] of resting) {
    if (!p.top) continue;
    drawGlow(c, cam, p, g.cls === "clear" ? [170, 232, 245] : GUAYABA, p.glow);
    drawGrain(c, cam, g, p);
  }
  drawMarks(c, cam, t);
  const person = t > T.review.yema_in;                 // desde que entra la persona
  if (person) drawTableStrokes(c, cam, t);

  drawCaption(c, cam, layout.captions[0], T.captions[0], T.captions_out[0], t);
  drawCaption(c, cam, layout.captions[1], T.captions[1], T.captions_out[1], t);
  drawCaption(c, cam, layout.title, T.guani + 0.14, T.title_out, t);
  drawCaption(c, cam, layout.reviewTitle, T.review.title[0], T.review.title[1], t);
  for (const L of layout.labels) drawLabel(c, cam, L, t);
  if (person) for (const N of review.notes) drawNote(c, cam, N, t);
  c.setTransform(1, 0, 0, 1, 0, 0);

  // Lo que vuela pasa por delante de todo, desenfocado.
  for (const [g, p] of flying) {
    if (p.top) drawGlow(c, cam, p, g.cls === "clear" ? [170, 232, 245] : GUAYABA, p.glow);
    drawGrain(c, cam, g, p);
  }
  if (!guaniLanded) drawGuani(c, cam, t);
  if (person) drawFront(c, cam, t);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.filter = "none";
}

// Cuántos subcuadros mezcla cada cuadro: más donde algo va rápido.
function samplesAt(t) {
  const [w0, w1] = T.whip;
  if (t >= w0 - 0.04 && t < w0 + 0.32) return 40;
  if (t >= w0 + 0.32 && t < w0 + 0.5) return 20;
  if (t >= w0 + 0.5 && t < w1 + 0.2) return 10;
  if (t >= T.avalanche - 0.25 && t < w0) return 8;
  for (const at of T.capsules) if (t > at - 0.36 && t < at + 0.16) return 10;
  if (t > T.guani - 0.5 && t < T.guani + 0.45) return 12;
  if (t >= T.discard[0] - 0.05 && t < T.discard[1] + 0.2) return 8;
  if (t >= T.clear - 0.05 && t < T.clear + 1.0) return 6;
  if (t >= w1 && t < T.guani) return 6;
  const M = T.measure;
  if (t >= M.anticipation) {                           // la misma medida: más donde la cámara entra o algo vuela o rueda
    if (t < M.dive[1]) return t < M.dive[0] + 0.42 ? 14 : 8;
    if (t >= M.words[0][0] && t < M.province[1] + 0.05) return 12;
    if (t >= M.pack_out[0] && t < M.regroup[0]) return 8;
    if (t >= M.regroup[0] && t < M.regroup[1] + 0.02) return 16;
    if (t >= M.roll_a[0] && t < M.roll_a[1]) return 10;
    if (t >= M.roll_a[1] && t < M.rise_b[1] + 0.02) return 14;
    if (t >= M.rise_b[1] && t < M.drops[2] + 0.3) return 8;
    if (t >= M.yema[0] && t < M.hand[1] + 0.1) return 6;
    return 4;
  }
  const R = T.review;
  if (t >= R.yema_in) {                                // el repaso: más donde la yema corre o algo se abre
    if (t < R.rings[1][0]) return 6;
    if (t < R.open[1] + 0.06) return 10;
    if (t >= R.morph[0] - 0.03 && t < R.morph[1] + 0.1) return 8;
    if (t >= R.close[0] - 0.06 && t < R.audit_ring[0]) return 10;
    if (t >= R.audit_ring[1] && t < R.sample_rings[4][1]) return 6;
    if (t >= R.yema_out[0] && t < R.yema_out[1]) return 6;
    return 4;
  }
  if (t >= T.doubt) return 4;
  return 3;
}

function post(c, t) {
  // Halo de lo más claro.
  bc.setTransform(1, 0, 0, 1, 0, 0);
  bc.globalCompositeOperation = "source-over";
  bc.filter = "contrast(2.4) brightness(0.82) blur(3.5px)";
  bc.drawImage(accCanvas, 0, 0, W / 4, H / 4);
  bc.filter = "none";
  c.globalCompositeOperation = "lighter"; c.globalAlpha = 0.1;
  c.drawImage(bloomCanvas, 0, 0, W, H);
  c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
  // Viñeta.
  const v = c.createRadialGradient(W / 2, H * 0.46, 420, W / 2, H * 0.46, 920);
  v.addColorStop(0, "rgba(1,8,15,0)"); v.addColorStop(0.6, "rgba(1,8,15,0.2)"); v.addColorStop(1, "rgba(1,8,15,0.62)");
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  const dark = 1 - smooth(0, T.fade_in, t);
  if (dark > 0) { c.fillStyle = `rgba(0,0,0,${dark})`; c.fillRect(0, 0, W, H); }
}

// Dibuja el cuadro del instante `t`. Con `samples` se fuerza cuántos subcuadros mezclar.
function seek(t, samples) {
  const n = samples || samplesAt(t);
  const shutter = (t >= T.whip[0] - 0.04 && t < T.whip[1] ? 0.8 : 0.62) / T.fps;
  ac.setTransform(1, 0, 0, 1, 0, 0);
  ac.globalCompositeOperation = "source-over";
  for (let k = 0; k < n; k++) {
    const ts = Math.max(0, t + (n === 1 ? 0 : ((k + 0.5) / n - 0.5) * shutter));
    drawScene(sc, ts);
    ac.globalAlpha = 1 / (k + 1);
    ac.drawImage(sceneCanvas, 0, 0);
  }
  ac.globalAlpha = 1;
  out.setTransform(1, 0, 0, 1, 0, 0);
  out.globalCompositeOperation = "source-over"; out.globalAlpha = 1;
  out.drawImage(accCanvas, 0, 0);
  post(out, t);
  return n;
}

async function init(config) {
  T = config.timeline; D = config.data;
  const faces = [
    new FontFace("Alice", `url(${FONTS}/alice.woff2)`),
    new FontFace("Roboto", `url(${FONTS}/roboto.woff2)`, { weight: "100 900" }),
    new FontFace("Noto Color Emoji", `url(${FONTS}/noto-color-emoji.woff2)`),   // los emojis de los anuncios reales
  ];
  for (const f of faces) { await f.load(); document.fonts.add(f); }
  await document.fonts.ready;

  const alice = (text, px, max) => fitText(text, "Alice", 400, wu(px), wu(max));
  const roboto = (text, px, weight) => fitText(text, "Roboto", weight, wu(px), wu(660));
  const caption = (texts, px, bases) => {
    const lines = texts.map((s) => alice(s, px, 620));
    return { lines, bases, sx: 360, shadow: captionShadow(lines, bases, 360) };
  };
  layout = {
    question: T.question.map((line) => fitText(line, "Alice", 400, 112, 628)),
    questionY: [-398, -276],
    captions: [
      caption(["Miles de", "mensajes."], 98, [212, 314]),
      caption(["Cada uno", "a su manera."], 68, [1056, 1128]),
    ],
    title: caption(["Guani lee."], 86, [388]),
    reviewTitle: caption(["Una persona", "supervisa."], 80, [384, 468]),
    // `t1`: cuándo se retira cada rótulo de la máquina, para dejarle el sitio a los de la persona.
    labels: [
      { fit: roboto("no es un precio", 38, 500), sx: 360, sy: 1000, align: "center", color: COLD, t0: T.discard_label, t1: T.review.discard_label_out, rule: [196, 524, 1016] },
      { fit: roboto("claro", 42, 700), sx: 688, sy: 452, align: "right", color: [255, 255, 255], t0: T.clear_label, t1: T.review.labels_out[0] },
      { fit: roboto("dos lecturas coinciden", 34, 400), sx: 688, sy: 494, align: "right", color: COLD, t0: T.clear_label + 0.12, t1: T.review.labels_out[0], rule: [356, 688, 512] },
      { fit: roboto("dudoso", 42, 700), sx: 38, sy: 494, align: "left", color: GUAYABA, t0: T.doubt_label, t1: T.review.labels_out[1], rule: [38, 268, 512] },
    ],
  };
  makeTextures();
  makeTooth();
  build();
  buildReview();
  buildTally();
  return info();
}

function info() {
  const count = (cls) => grains.filter((g) => g.cls === cls).length;
  return { grains: grains.length, clear: count("clear"), doubtful: count("doubt"), discarded: count("none") };
}

window.init = init;
window.seek = seek;
window.info = info;
window.capture = (t, samples) => { seek(t, samples); return view.toDataURL("image/png"); };
// Cuánto tarda un subcuadro, en ms: para saber dónde se va el tiempo de render.
window.profile = (t) => { const a = performance.now(); drawScene(sc, t); return performance.now() - a; };
</script>
