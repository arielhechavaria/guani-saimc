[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saimc"
version = "0.1.0"
description = "Sistema Abierto de Inteligencia de Mercado para Cuba"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Motor de OCR primario (`saimc.extraction.ocr`), con Tesseract de respaldo si
# no está instalado. Opcional y no en `dependencies`: son 417 MB de modelos
# ONNX que un entorno de desarrollo liviano puede no querer, y el módulo
# degrada solo si falta (docs/decisions.md, 2026-08-31).
ocr = [
    "rapidocr>=3.9",
    "onnxruntime>=1.29",
]
# Asistente de extracción por LLM (`saimc.extraction.llm_assist`). Opcional por
# el mismo motivo que `ocr`: sin el paquete —o sin clave— el asistente degrada
# a "sin propuesta" y la cola de curaduría funciona igual que hoy. El costo de
# la API es adicional al plan Pro del operador, ver docs/costos.md.
llm = [
    "anthropic>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La raíz del repo en `sys.path`, para que `from tests.test_cells import ...`
# resuelva. `tests/` no es un paquete (no tiene `__init__.py`), así que sin
# esto el import solo funciona con `python -m pytest` —que agrega el CWD por su
# cuenta— y revienta en el colector con `.venv/bin/pytest`, que es el comando
# documentado. Los dos tienen que andar.
pythonpath = ["."]
