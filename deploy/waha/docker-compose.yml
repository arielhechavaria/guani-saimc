# WAHA — canal de automatización de WhatsApp (docs/decisions.md, 2026-08-15).
#
# NO es infraestructura de SAIMC: es un servicio externo que el operador corre
# en su propio VPS, aparte del despliegue de SAIMC (systemd/). Vive en el
# repo igual porque sin versionarlo se pierde en cuanto se reinstala el VPS,
# y es la contraparte exacta del webhook que recibe SAIMC en
# `src/saimc/web/routers/whatsapp_webhook.py`.
#
# Uso: copiar este directorio al VPS, crear un `.env` al lado (ver
# `.env.example`, NUNCA commitear el real — mismo criterio que el `.env` de
# SAIMC, ver `.gitignore`), y correr `docker compose up -d` desde acá.

services:
  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    ports:
      # Atado a loopback a propósito (docs/decisions.md, 2026-08-17): sin el
      # prefijo "127.0.0.1:", Docker publica en 0.0.0.0 — la API de WAHA
      # (X-Api-Key) queda alcanzable desde internet. SAIMC ya le habla por
      # 127.0.0.1 (SAIMC_WAHA_BASE_URL), no hace falta más que esto. Una
      # regla de ufw sola no alcanza acá: Docker inserta sus propias reglas
      # de iptables para puertos publicados y en la mayoría de las
      # configuraciones evita el chain INPUT donde vive ufw.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./sessions:/app/.sessions
    env_file:
      - .env
    extra_hosts:
      # SAIMC corre en el host (uvicorn directo, sin Docker), no en este
      # contenedor. `127.0.0.1` en WHATSAPP_HOOK_URL apunta al loopback del
      # propio contenedor y nunca llega — hay que usar este nombre especial.
      - "host.docker.internal:host-gateway"
