<div style="font-size: 27px; font-weight: 700; letter-spacing: 0.12em; color: #015a63">CÓMO LEER LOS PRECIOS · 1 DE 3</div>
<div style="margin-top: 28px; font-family: 'Alice', Georgia, serif; font-size: 100px; line-height: 1.06">Guani muestra un rango, no un precio único.</div>
<div style="margin-top: 48px; background: #ffffff; border-radius: 40px; padding: 40px 40px 36px; box-sizing: border-box; box-shadow: 0 2px 4px rgba(5, 32, 48, 0.08), 0 8px 28px rgba(5, 32, 48, 0.06)">
<div style="position: relative; height: 40px; margin-top: 8px; border-radius: 100px; background: #e8f1f6">
<div style="position: absolute; top: 0; left: 14%; width: 62%; height: 40px; border-radius: 100px; background: #05668d"></div>
<div style="position: absolute; top: -8px; left: 44%; width: 40px; height: 40px; margin-left: -28px; border-radius: 50%; background: #ffffff; border: 8px solid #05668d"></div>
</div>
<div style="position: relative; height: 96px; margin-top: 20px">
<div style="position: absolute; left: 14%; font-size: 28px; font-weight: 500; transform: translateX(-30%)">mínimo<br><span style="font-family: 'Alice', Georgia, serif; font-size: 44px">000</span></div>
<div style="position: absolute; left: 44%; font-size: 28px; font-weight: 500; transform: translateX(-50%); text-align: center">mediana<br><span style="font-family: 'Alice', Georgia, serif; font-size: 44px">000</span></div>
<div style="position: absolute; left: 76%; font-size: 28px; font-weight: 500; transform: translateX(-70%); text-align: right">máximo<br><span style="font-family: 'Alice', Georgia, serif; font-size: 44px">000</span></div>
</div>
</div>
<div style="margin-top: 40px; font-size: 34px; line-height: 1.4; color: #3f4949">Un solo anuncio puede ser un caso raro. El rango muestra lo que se ve en el mercado, y la mediana marca el punto medio de lo observado.</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; gap: 16px">
<svg viewBox="0 0 80 80" width="64" height="64" role="img" aria-label="Guani">
<circle cx="40" cy="40" r="39" fill="#ffffff" stroke="#c4cfcf" stroke-width="2"/>
