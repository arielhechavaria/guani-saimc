<script>
  // Relabel en vivo de la opción "por unidad" del control de `price_basis`
  // cuando el operador cambia la unidad de la fila DESPUÉS de cargar la
  // página. Es una mejora cosmética, nunca el mecanismo probado: el texto
  // server-rendered (macro `price_row_card`, `_price_row_card.html`) es lo
  // que el escenario de la especificación afirma. Si este script nunca
  // corre, la etiqueta puede quedar desactualizada pero el valor enviado y
  // toda regla del servidor siguen intactos (design.md, D8).
  //
  // Delegado en `document`, mismo estilo que el botón "Eliminar" de la fila
  // en curation.html: las filas se agregan/quitan del DOM sin recargar, así
  // que un listener atado a un elemento puntual no cubriría filas nuevas.
  document.addEventListener('change', function (event) {
    var unitSelect = event.target.closest('select[id^="unit_"]');
    if (!unitSelect) return;

    var index = unitSelect.id.slice('unit_'.length);
    var basisSelect = document.getElementById('price_basis_' + index);
    if (!basisSelect) return;

    var unitOption = basisSelect.querySelector('option[value="unit"]');
    if (!unitOption) return;

    var selectedUnit = unitSelect.options[unitSelect.selectedIndex];
    var label = selectedUnit ? selectedUnit.getAttribute('data-basis-label') : null;
    unitOption.textContent = label
      ? ('Precio por ' + label)
      : 'Precio de una sola unidad de esta fila';
  });

  // Oculta el campo `price_basis` mientras la cantidad valga 1: ahí "unit" y
  // "total" son el mismo número (`_price_row_card.html`, `m3-help` del
  // campo), así que preguntar no aporta nada. Igual criterio D8 que el
  // relabel de arriba: es cosmético, nunca el mecanismo que valida — si este
  // script no corre, el campo queda visible siempre, que es el
  // comportamiento sin JS. `input` y no `change`: la cantidad es un
  // `<input type="text">`, no un `<select>`, y reaccionar tecla a tecla es
  // lo que hace sentir el campo "vivo" mientras se escribe.
  function syncBasisVisibility(quantityInput) {
    var index = quantityInput.id.slice('quantity_'.length);
    var wrap = document.getElementById('price_basis_wrap_' + index);
    if (!wrap) return;

    var value = parseFloat(quantityInput.value);
    wrap.style.display = value === 1 ? 'none' : '';
  }

  document.addEventListener('input', function (event) {
    var quantityInput = event.target.closest('input[id^="quantity_"]');
    if (quantityInput) syncBasisVisibility(quantityInput);
  });

  document.querySelectorAll('input[id^="quantity_"]').forEach(syncBasisVisibility);

  // Atenúa la tarjeta de una fila marcada para eliminar, para que se vea qué
  // se va antes de guardar. Solo cosmético: sin JS, la casilla igual se
  // envía y el servidor borra la fila lo mismo.
  document.addEventListener('change', function (event) {
    var box = event.target.closest('input[data-delete-row]');
    if (!box) return;
    var card = box.closest('.m3-row-card');
    if (card) card.style.opacity = box.checked ? '0.45' : '';
  });
</script>
