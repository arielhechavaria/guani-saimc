<script>
  // Relabel en vivo de las DOS opciones del control de `price_basis` cuando el
  // operador cambia la unidad o la cantidad de la fila DESPUÉS de cargar la
  // página. El texto server-rendered (macro `price_row_card`,
  // `_price_row_card.html`) sigue siendo lo que el escenario de la
  // especificación afirma, y si este script nunca corre el valor enviado y toda
  // regla del servidor quedan intactos (design.md, D8).
  //
  // Pero acá no es solo cosmético como el relabel original: en la cola la fila
  // nueva llega vacía y el operador escribe cantidad y unidad JUSTO ANTES de
  // responder el basis. Sin esto, la opción "total" diría «Precio total del
  // anuncio» en el único momento en que se la lee — que es el error del
  // 2026-09-05 documentado en `_price_row_card.html`.
  function syncBasisLabels(index) {
    var basisSelect = document.getElementById('price_basis_' + index);
    var unitSelect = document.getElementById('unit_' + index);
    if (!basisSelect || !unitSelect) return;

    var selectedUnit = unitSelect.options[unitSelect.selectedIndex];
    var singular = selectedUnit ? selectedUnit.getAttribute('data-basis-label') : null;
    var plural = selectedUnit ? selectedUnit.getAttribute('data-basis-label-plural') : null;

    var unitOption = basisSelect.querySelector('option[value="unit"]');
    if (unitOption) {
      unitOption.textContent = singular
        ? ('Precio por ' + singular)
        : 'Precio de una sola unidad de esta fila';
    }

    var totalOption = basisSelect.querySelector('option[value="total"]');
    var quantityInput = document.getElementById('quantity_' + index);
    if (totalOption) {
      // `parseFloat` y de vuelta a string recorta los ceros de escala igual que
      // el `rstrip` del server: "40.00" -> 40, "0.50" -> 0.5.
      var cantidad = quantityInput ? parseFloat(quantityInput.value) : NaN;
      totalOption.textContent = (plural && isFinite(cantidad) && cantidad !== 1)
        ? ('Precio de las ' + cantidad + ' ' + plural + ' juntas')
        : 'Precio total del anuncio';
    }
  }

  // Delegado en `document`, mismo estilo que el botón "Eliminar" de la fila
  // en curation.html: las filas se agregan/quitan del DOM sin recargar, así
  // que un listener atado a un elemento puntual no cubriría filas nuevas.
  document.addEventListener('change', function (event) {
    var unitSelect = event.target.closest('select[id^="unit_"]');
    if (unitSelect) syncBasisLabels(unitSelect.id.slice('unit_'.length));
  });

  // Oculta el campo `price_basis` mientras la cantidad valga 1: ahí "unit" y
  // "total" son el mismo número (`_price_row_card.html`, `m3-help` del
  // campo), así que preguntar no aporta nada. Igual criterio D8 que el
  // relabel de arriba: es cosmético, nunca el mecanismo que valida — si este
  // script no corre, el campo queda visible siempre, que es el
  // comportamiento sin JS. `input` y no `change`: la cantidad es un
  // `<input type="text">`, no un `<select>`, y reaccionar tecla a tecla es
  // lo que hace sentir el campo "vivo" mientras se escribe.
  function syncBasisVisibility(quantityInput) {
    var index = quantityInput.id.slice('quantity_'.length);
    var wrap = document.getElementById('price_basis_wrap_' + index);
    if (!wrap) return;

    var value = parseFloat(quantityInput.value);
    wrap.style.display = value === 1 ? 'none' : '';
  }

  document.addEventListener('input', function (event) {
    var quantityInput = event.target.closest('input[id^="quantity_"]');
    if (!quantityInput) return;
    syncBasisVisibility(quantityInput);
    syncBasisLabels(quantityInput.id.slice('quantity_'.length));
  });

  document.querySelectorAll('input[id^="quantity_"]').forEach(syncBasisVisibility);

  // El `<select>` de formato del catálogo no se envía: copia el triple a los
  // tres campos que el backend ya sabe resolver, así el POST llega idéntico al
  // de una carga a mano y `_resolve_format_id` no cambia. Sin JS el select no
  // hace nada y el operador carga los tres campos como siempre.
  document.addEventListener('change', function (event) {
    var pick = event.target.closest('select[data-format-pick]');
    if (!pick) return;
    var option = pick.options[pick.selectedIndex];
    if (!option || !option.value) return;

    var index = pick.id.slice('format_pick_'.length);
    var packaging = document.getElementById('packaging_' + index);
    var quantity = document.getElementById('quantity_' + index);
    var unit = document.getElementById('unit_' + index);
    if (packaging) packaging.value = option.getAttribute('data-packaging');
    if (quantity) quantity.value = option.getAttribute('data-quantity');
    if (unit) unit.value = option.getAttribute('data-unit');

    // Asignar `.value` por código no dispara `change` ni `input`, así que el
    // control de `price_basis` se quedaría con el texto de la cantidad y la
    // unidad anteriores — que es justo el error del 2026-09-05 que el relabel
    // en vivo vino a cerrar. Se lo avisa a mano.
    if (quantity) syncBasisVisibility(quantity);
    syncBasisLabels(index);
  });

  // Atenúa la tarjeta de una fila marcada para eliminar, para que se vea qué
  // se va antes de guardar. Solo cosmético: sin JS, la casilla igual se
  // envía y el servidor borra la fila lo mismo.
  document.addEventListener('change', function (event) {
    var box = event.target.closest('input[data-delete-row]');
    if (!box) return;
    var card = box.closest('.m3-row-card');
    if (card) card.style.opacity = box.checked ? '0.45' : '';
  });
</script>
